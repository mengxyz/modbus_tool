name: Build release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out selected tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate stable semantic version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use stable semantic versioning, for example v1.2.3" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            task: :composeApp:packageDmg
            artifact: macos-arm64
            path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: macos-15-intel
            task: :composeApp:packageDmg
            artifact: macos-x64
            path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-2022
            task: :composeApp:packageMsi
            artifact: windows-x64
            path: composeApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-24.04
            task: :composeApp:packageDeb
            artifact: linux-x64
            path: composeApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out selected tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and package
        shell: bash
        run: ./gradlew allTests ${{ matrix.task }} -PappVersion=${{ needs.validate.outputs.version }} --stacktrace

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Add platform names and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-files
          while IFS= read -r file; do
            platform="$(basename "$(dirname "$file")")"
            extension="${file##*.}"
            cp "$file" "release-files/Modbus-Tool-${VERSION}-${platform}.${extension}"
          done < <(find release-artifacts -type f)
          cd release-files
          sha256sum Modbus-Tool-* > SHA256SUMS.txt

      - name: Create release and generated changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* \
              --verify-tag \
              --generate-notes \
              --title "Modbus Tool $RELEASE_TAG"
          fi
